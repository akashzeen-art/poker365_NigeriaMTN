# Copy to server:
#   sudo cp scripts/nginx-poker365.world.conf /etc/nginx/sites-available/poker365.world
#   sudo ln -sf /etc/nginx/sites-available/poker365.world /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name poker365.world www.poker365.world;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name poker365.world www.poker365.world;

    # Certbot usually adds these lines — adjust paths if yours differ:
    # ssl_certificate /etc/letsencrypt/live/poker365.world/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/poker365.world/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5500;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
