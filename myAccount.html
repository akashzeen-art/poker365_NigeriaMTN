  <body>
    <canvas class="webgl"></canvas>
    <nav style="display: flex; justify-content: space-between; align-items: center; gap: 50px;">

      <div class="navSmall">

        </div>
      </div>

    <main>

      <section id="section2">
        <div class="sec5Tit content1" data-i18n="myAccountTitle">My Account</div>
        <div class="secContact content2" id="profile-card" style="display:none;flex-direction:column;align-items:center;gap:1rem;">
          <div style="width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#00c5eb,#006177);display:flex;align-items:center;justify-content:center;">
            <span style="font-size:2rem;">👤</span>
          </div>
          <div style="font-family:'Josefin Sans',sans-serif;font-size:1rem;color:beige;text-align:center;">
            <div style="font-size:0.78rem;opacity:0.6;margin-bottom:0.2rem;" data-i18n="profilePhone">Mobile Number</div>
            <div id="profile-phone" style="font-weight:700;font-size:1.1rem;"></div>
          </div>
          <div style="font-family:'Josefin Sans',sans-serif;font-size:0.85rem;color:#03fc2c;font-weight:700;" id="profile-status"></div>
          <div style="display:flex;gap:0.75rem;flex-wrap:wrap;justify-content:center;">
            <button id="btn-unsubscribe" aria-label="unsubscribe" data-i18n="unsubscribe" style="padding:0.5rem 1.2rem;background:transparent;border:2px solid #dc2626;color:#dc2626;font-family:'Josefin Sans',sans-serif;font-weight:700;border-radius:0.6rem;cursor:pointer;">Unsubscribe</button>
            <button id="btn-logout" aria-label="logout" data-i18n="logout" style="padding:0.5rem 1.2rem;background:#ff9e03;border:none;color:#000;font-family:'Josefin Sans',sans-serif;font-weight:700;border-radius:0.6rem;cursor:pointer;">Logout</button>
          </div>
          <p id="unsubscribe-msg" style="display:none;font-size:0.78rem;color:#dc2626;font-family:'Josefin Sans',sans-serif;"></p>
        </div>
        <div class="secContact content2" id="profile-guest" style="flex-direction:column;align-items:center;gap:0.75rem;">
          <p style="font-family:'Josefin Sans',sans-serif;color:beige;font-size:0.9rem;" data-i18n="profileGuest">No account found. Please subscribe to access games.</p>
          <button id="btn-go-subscribe" aria-label="go subscribe" data-i18n="popupSubmit" onclick="window.location.href='./index.html'" style="padding:0.5rem 1.4rem;background:#ff9e03;border:none;color:#000;font-family:'Josefin Sans',sans-serif;font-weight:700;border-radius:0.6rem;cursor:pointer;">Play Now</button>
        </div>
      </section>
      


    </main>
